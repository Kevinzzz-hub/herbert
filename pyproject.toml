[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "herbert-reader"
version = "0.1.0"
description = "An AI-powered PDF reading assistant."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=2.53,<3",
    "pypdf>=6.15,<7",
    "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
]

[project.scripts]
herbert = "herbert.cli:main"

[tool.setuptools.packages.find]
include = ["herbert*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
